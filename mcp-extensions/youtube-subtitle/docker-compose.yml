# YouTube subtitle MCP server for NeuralNetUI.
# First start: `mkdir -p config && docker compose up -d --build`, then copy api_key from config/config.json.
services:
  youtube-subtitle:
    build: .
    image: nnui-youtube-subtitle:latest
    container_name: nnui-youtube-subtitle
    restart: unless-stopped
    # Runs as the host user so the generated config/config.json stays readable and editable on the host.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${YOUTUBE_SUBTITLE_PORT:-8080}:8080"
    volumes:
      - ./config:/config
