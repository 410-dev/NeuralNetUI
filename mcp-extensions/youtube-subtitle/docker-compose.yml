# YouTube subtitle MCP server for NeuralNetUI.
# First start: `mkdir -p config downloads && chown 1000:1000 config downloads && docker compose up -d --build`, then copy api_key from config/config.json.
services:
  youtube-subtitle:
    build: .
    image: nnui-youtube-subtitle:latest
    container_name: nnui-youtube-subtitle
    restart: unless-stopped
    # The container user must be able to write ./config (it writes the generated key there). The default 1000:1000 is
    # the first regular user on most Linux hosts; set YOUTUBE_SUBTITLE_UID/GID to match the owner of ./config otherwise.
    user: "${YOUTUBE_SUBTITLE_UID:-1000}:${YOUTUBE_SUBTITLE_GID:-1000}"
    ports:
      - "${YOUTUBE_SUBTITLE_PORT:-8080}:8080"
    volumes:
      - ./config:/config
      # Downloaded videos wait here until NeuralNetUI has stored them (removed afterwards, or after download_ttl_minutes).
      - ./downloads:/downloads
